name: CI

# Foundation CI: install, typecheck, lint, format, unit tests, integration
# tests (apps/dashboard-api's own auth e2e suite plus dashboard-web's
# Playwright smoke test — needs a disposable postgres:16 service container
# as of Phase 1C, since dashboard-api's AuthModule genuinely needs a real
# database to construct), a database migration test (Phase 1B — its own
# separate disposable postgres:16 service container, not the real chosen
# Marketplace provider), production build, workspace boundary check,
# secret-pattern scan. NO deploy job exists — deploying from CI is out of
# scope until a later, separately-authorized phase
# (docs/repository-plan/branch-and-release-plan.md). No production
# credentials are referenced anywhere in this file.
#
# No "skill/profile validation" job exists here deliberately: the
# webdesk-nodejs base skill and profile are gitignored (see .gitignore) —
# a separate, shared asset not part of this repository's own history — so
# they are never checked out in this repo's CI and there is nothing here
# for such a job to validate. Skill/profile validation runs locally
# (webdesk-nodejs/.../tools/validate-all.py) or via that skill's own
# separate export/review process, not this application repository's CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

  secret-scan:
    name: Secret-pattern scan
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/scan-secrets.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Formatting validation
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format

  boundaries:
    name: Workspace-boundary check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm boundaries:check

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: install
    # dashboard-api's own auth e2e suite (test/auth.e2e-spec.ts, Phase 1C)
    # boots a real AuthModule, whose repositories construct a real
    # @webdesk/database connection — a disposable service container, same
    # shape as database-migration-test's (a separate container/job, not
    # shared state; no port/name collision risk running in parallel).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webdesk_ci
          POSTGRES_PASSWORD: webdesk_ci_disposable
          POSTGRES_DB: webdesk_phase1c_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://webdesk_ci:webdesk_ci_disposable@localhost:5432/webdesk_phase1c_ci
      DATABASE_SSL: "false"
      # Fixture values only — this job never touches a real Google OAuth
      # client or SMTP account (docs/task-packages/phase-1c-authentication-sessions.md).
      GOOGLE_OAUTH_CLIENT_ID: ci-fixture-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-fixture-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: https://api.example.com/auth/google/callback
      WEB_APP_ORIGIN: https://dashboard.example.com
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # dashboard-api's test:integration imports @webdesk/database's real
      # runtime exports (repositories, buildMigrator) — Vite must resolve
      # an actually-built dist/, not just type declarations. Same
      # fresh-checkout build-order issue documented in
      # docs/project-state/phase-1b-validation-report.md §8: turbo's own
      # `dependsOn: ["^build"]` builds every workspace dependency first,
      # a package-local `pnpm build` would not.
      - name: Build dashboard-api, dashboard-web, and their workspace dependencies
        run: npx turbo run build --filter=@webdesk/dashboard-api --filter=@webdesk/dashboard-web
      - name: dashboard-api integration tests
        run: pnpm --filter @webdesk/dashboard-api test:integration
      - name: dashboard-web Playwright browsers
        run: pnpm --filter @webdesk/dashboard-web exec playwright install --with-deps chromium
      - name: dashboard-web smoke test
        run: pnpm --filter @webdesk/dashboard-web test:integration

  database-migration-test:
    name: Database migration test
    runs-on: ubuntu-latest
    needs: install
    # Real disposable PostgreSQL service container — provider-agnostic, not
    # the actual chosen Marketplace provider (Supabase). Never staging or
    # production, per docs/contracts/database-contract.md's "Test
    # requirements". No real credentials — the password below is a
    # throwaway value for a container that only exists for this job's
    # lifetime.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: webdesk_ci
          POSTGRES_PASSWORD: webdesk_ci_disposable
          POSTGRES_DB: webdesk_phase1b_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://webdesk_ci:webdesk_ci_disposable@localhost:5432/webdesk_phase1b_ci
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/database depends on @webdesk/shared-types and
      # @webdesk/configuration (read from their dist/*.d.ts at compile
      # time) -- `pnpm --filter @webdesk/database build` alone only runs
      # that one package's own `tsc`, which fails on a fresh checkout
      # where those dependencies haven't been built yet. `turbo run build`
      # respects turbo.json's `dependsOn: ["^build"]` and builds them
      # first.
      - name: Build @webdesk/database and its workspace dependencies
        run: npx turbo run build --filter=@webdesk/database
      - name: Migration up/down round-trip
        run: pnpm --filter @webdesk/database migrate:test
      - name: Database foundation integration tests
        run: pnpm --filter @webdesk/database test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    needs: install
    # Non-blocking for Phase 1A — surfaced for visibility, not yet gating merges.
    # Revisit once real (non-foundation) dependencies accumulate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

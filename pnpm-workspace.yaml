packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  sharp: true

# Targeted security-patch overrides only. Every range has BOTH a floor (the
# patched version) and a ceiling (one major above the version this package was
# resolving to before this override) -- an unbounded ">=x" range silently let
# glob jump 10.x -> 13.x and body-parser jump 1.x -> 2.x on first install here,
# a real regression risk (body-parser 2.x is what Express 5 expects, not the
# 4.x line this project pins), caught only by re-running the full validation
# suite after installing, not by reading the override alone. Each bump stays
# within (or, for qs/body-parser, one patch version beyond express@4.22.2's
# own pin, since no newer express@4.x exists yet) what its parent package
# already tolerates.
#
# multer, file-type, and @nestjs/core's own CVE (all exact-pinned by
# @nestjs/* 10.x, no fix anywhere in the 10.x line) and postcss/sharp
# (pinned/ranged by next@15.5.22, no newer stable 15.x line) are NOT
# overridden here -- overriding an exact-pinned internal framework dependency
# risks breaking internals we don't control. Both groups were instead
# resolved by direct major-version bumps (NestJS 10.x -> 11.x, Next.js
# 15.x -> 16.x) -- see docs/project-state/dependency-audit-2026-08-08.md.
#
# uuid: the version sequelize@6.37.8 pins internally (8.3.2) has no patch
# anywhere in the 8.x line either (patched only >=11.1.1) -- same situation
# as the above, but here an override IS safe: sequelize's own code only
# calls `uuid.v1`/`uuid.v4`, both stable, unchanged functions across 8.x-11.x,
# confirmed by reading sequelize's own source before overriding, not assumed.
#
# vite: vitest@3.2.7's own dependency range (`^5.0.0 || ^6.0.0 || ^7.0.0-0`)
# is broad enough that pnpm kept the already-present unpatched 5.4.21
# instead of picking a patched 6.x release -- vitest itself explicitly
# supports the 6.x line, so forcing it here is safe, not a version vitest
# doesn't expect.
#
# ajv: no override needed or present. A blanket override was tried once and
# reverted (broke ESLint's own bundled ajv), but the moderate finding this
# was working around is now gone as a side effect of the NestJS 10.x -> 11.x
# bump: @nestjs/cli@11 pulls a newer @angular-devkit chain
# (@angular-devkit/core@19.2.x) whose own ajv-formats->ajv path no longer
# resolves to the vulnerable version -- confirmed via `pnpm why ajv`.
#
# nanoid: resolved to the single version 3.3.17 (patched >=3.3.18) purely
# transitively via postcss (next@16.3.0's own dependency, and separately via
# webpack/vite's dev-tooling chains -- @nestjs/cli, vitest) -- confirmed via
# `pnpm why nanoid` before overriding. No direct caller in this codebase; a
# patch-level bump within the same 3.x line postcss already resolves to, so
# no behavioral risk. GHSA-2v37-7h3g-55p8 (custom generators loop
# indefinitely when size is zero) -- surfaced 2026-08-13, unrelated to any
# code change in that session's PR, confirmed present on `main` independent
# of it.
#
# See docs/project-state/dependency-audit-2026-08-07.md (original triage) and
# docs/project-state/dependency-audit-2026-08-08.md (this session's bumps)
# for the full record.
#
# htmlparser2: NOT a security patch, unlike every entry above -- a deliberate
# MAJOR-VERSION DOWNGRADE working around a real production outage
# (2026-08-20). sanitize-html@2.17.7 (still the latest release) requires
# htmlparser2@^12.0.0, but htmlparser2 dropped its dual CJS+ESM build
# entirely as of 11.0.0 (>=11 ships `"type": "module"` with no `require`
# export condition) -- sanitize-html's own `require('htmlparser2')` then
# throws ERR_REQUIRE_ESM under Vercel's Node Function runtime specifically
# (confirmed directly from real production logs), a class of bundling gap
# invisible to every local/CI check, which run under plain Node rather than
# Vercel's Function bundler + runtime. 10.1.0 is the newest version that
# still ships the dual build (via `tshy`, real `dist/commonjs/index.js`).
# Confirmed safe for our actual usage before overriding, not assumed: read
# sanitize-html's own source (only `require('htmlparser2')` for its
# `Parser`/`DomHandler` API, stable across this version range) and confirmed
# the one behavioral difference between 10.x and >=11 flagged in
# sanitize-html's own code comments (RCDATA decoding for `<textarea>`/
# `<title>`) is irrelevant, since neither tag is in this project's own
# sanitizer allowlist (`packages/validation/src/sanitize-html.ts`). The full
# existing `sanitize-html.util.spec.ts` suite (11 tests -- script-stripping,
# disallowed tags, XSS payloads, table handling) re-ran clean against the
# overridden version before this was relied on.
overrides:
  glob: '>=10.5.0 <11.0.0'
  picomatch: '>=4.0.4 <5.0.0'
  tmp: '>=0.2.6 <0.3.0'
  esbuild: '>=0.25.0 <0.26.0'
  webpack: '>=5.104.1 <6.0.0'
  js-yaml: '>=4.3.1 <5.0.0'
  lodash: '>=4.17.24 <5.0.0'
  qs: '>=6.15.2 <7.0.0'
  body-parser: '>=1.20.6 <2.0.0'
  uuid: '>=11.1.1 <12.0.0'
  vite: '>=6.4.3 <7.0.0'
  nanoid: '>=3.3.18 <4.0.0'
  htmlparser2: '>=10.1.0 <11.0.0'

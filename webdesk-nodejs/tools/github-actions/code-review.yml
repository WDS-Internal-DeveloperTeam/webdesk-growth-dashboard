name: Code Review Agent
on:
  pull_request:
    branches: ["**"]
# Invokes the WebDesk Code Review Agent against the PR diff. The agent applies
# nodejs/knowledge code-review ruleset + architecture-fitness enforcement and
# posts review comments. It NEVER auto-fixes or auto-merges — a human commands
# fixes and merges (see _spine/code-review-agent/SKILL.md, no-auto-fix rule).
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run review agent
        # Skeleton: wire this to your agent runner / CLI. Output = PR review comments.
        run: echo "Invoke Code Review Agent on diff $(git diff --name-only origin/${{ github.base_ref }}...HEAD)"

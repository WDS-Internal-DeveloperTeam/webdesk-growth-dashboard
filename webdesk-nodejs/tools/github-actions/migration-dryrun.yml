name: Migration Dry-Run (up then down)
on:
  pull_request:
    paths: ["**/migrations/**", "**/db/**"]
jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dryrun }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dryrun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Migrate up
        run: npx sequelize-cli db:migrate
      - name: Migrate down (verify reversibility)
        run: npx sequelize-cli db:migrate:undo:all
